# Copy to family.toml (kept private) and describe your own family's kits.
# All names and files below are made up.
data_dir = "data"
owner = "A. Researcher"

[people.anna]
name = "Anna"
sex = "F"
role = "child"           # three full siblings for visual phasing

[people.bertil]
name = "Bertil"
sex = "M"
role = "child"

[people.cecilia]
name = "Cecilia"
sex = "F"
role = "child"

[people.dagmar]
name = "Dagmar"
sex = "F"
role = "mother"          # a tested parent anchors which side is which

[grandparents]           # optional labels for the report and plot
FF = "Paternal grandfather's side"
FM = "Paternal grandmother's side"
MF = "Maternal grandfather's side"
MM = "Maternal grandmother's side"

[raw_kits]
mother = "dagmar_raw.csv.gz"
[raw_kits.children]
anna = "anna_raw.csv.gz"
bertil = "bertil_raw.csv.gz"
cecilia = "cecilia_raw.csv.gz"

# FTDNA with `kit`: newest <kit>_Family_Finder_Matches_*.csv and
# <kit>_Chromosome_Browser_Results_*.csv. Otherwise `file` + `date`.
[[segment_exports]]
platform = "FTDNA"
subject = "anna"
kit = "B000001"

[[segment_exports]]
platform = "FTDNA"
subject = "dagmar"
kit = "B000004"

[[segment_exports]]
platform = "MyHeritage"
subject = "bertil"
file = "bertil_myheritage_segments.csv"
date = "2023-07-23"
# Newer than the mother's export? Then "absent from the mother's list" proves
# nothing, except for matches already in an export no newer than hers:
earlier = { file = "bertil_myheritage_segments_2021.csv", date = "2021-01-31" }

[[segment_exports]]
platform = "MyHeritage"
subject = "dagmar"
file = "dagmar_myheritage_segments.csv"
date = "2021-01-31"

# MyHeritage one-to-many "Download shared DNA info": only the matches
# selected in the browser, so mark it partial (absence means nothing)
[[segment_exports]]
platform = "MyHeritage"
subject = "anna"
file = "anna_one_to_many.csv"
date = "2026-01-31"
partial = true

[dnapainter]
anna = "dnapainter_backup_anna.txt"

[match_filter]
# The family's own kits, removed from match lists. Whole names only (a first
# name alone would also drop unrelated matches), one entry per spelling the
# vendors use; "(...)" and "c/o ..." are ignored when comparing.
family_names = ["Anna Example", "Bertil Example", "Cecilia Example",
                "Dagmar Maria Example", "Dagmar Maria Born"]
# MyHeritage match kits ("D-<kit>", the second half of the DNA Match ID)
family_kits = ["D-00000000-0000-0000-0000-00000000000A",
               "D-00000000-0000-0000-0000-00000000000B",
               "D-00000000-0000-0000-0000-00000000000C",
               "D-00000000-0000-0000-0000-00000000000D"]
# painted as matches in DNA Painter but saying nothing about lineage
close_family = ["Anna Example", "Bertil Example", "Cecilia Example",
                "Dagmar Maria Example", "Dagmar Maria Born"]

[[anchors]]
mother_kit = "B000004"
match_key = "erik example"       # as in the match list, lower-case
lineage = "MF"
evidence = "Dagmar's paternal first cousin (documented tree path)"

# A relative on the father's side (no father kit): judged among siblings
# whose exports all include the match (e.g. one-to-many selections)
[[anchors]]
group = "MyHeritage (selection)"
match_key = "name:olof example"
lineage = "FF"
evidence = "father's paternal second cousin (documented tree path)"

# Optional: the family tree (GEDCOM 5.5.1, e.g. a Gramps or MyHeritage
# export) for gedcom_io.py. proband is the tester the lineage codes start
# from: an xref ("@I0001@") or a FACT value such as a MyHeritage "MH:I1".
[gedcom]
file = "family_tree.ged"
proband = "@I0001@"
# earlier = ["older_export.ged"]   # only to repair damaged record labels (volumes.py)

# Parishes that occur in the tree's places but have no record volume cited
# yet, so volumes.py can still place those events (it learns the others
# from the citations).
[volumes]
parishes = ["Exampleby"]

# In-common-with (shared-match) evidence for icw_phasing.py
[[icw]]
kind = "autocluster"        # Genetic Affairs AutoCluster CSV (matrix)
subject = "anna"
platform = "MyHeritage"
file = "autocluster/anna_autoclusters.csv"

[[icw]]
kind = "ga_nodes_edges"     # Genetic Affairs node and edge CSVs (Gephi)
subject = "anna"
platform = "FTDNA"
nodes = "autocluster/anna_nodes.csv"
edges = "autocluster/anna_edges.csv"
exclude_values = [231]      # edge codes to leave out (check against placements first)

[[icw]]
kind = "ftdna_icw"          # FTDNA match list filtered "in common with" one match
subject = "anna"
focal = "Erik Example"
file = "anna_icw_erik_example.csv"
