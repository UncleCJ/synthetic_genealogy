<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work list</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1c1a;--mut:#6b6760;--line:#e2ded6;--card:#fff;--sel:#fff1bf;--acc:#2f6db5}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--fg:#ece9e2;--mut:#9b968c;--line:#34312c;--card:#201f1c;--sel:#4a4220;--acc:#6ea4e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
main{padding:8px 16px 24px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.kinds button{cursor:pointer}.kinds button.on{background:var(--sel);font-weight:600}.kinds .n{color:var(--mut);font-variant-numeric:tabular-nums}
.why{color:var(--mut);margin:0 0 8px}
table{border-collapse:collapse;width:100%}
th{text-align:left;color:var(--mut);font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);padding:3px 6px}
td{border-top:1px solid var(--line);padding:3px 6px;vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.on td{background:var(--sel)}
a{color:var(--acc)}.meta{color:var(--mut)}i.unk{color:var(--mut);font-weight:400}
.k{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--c)}
@media(max-width:700px){main{padding:8px}td:nth-child(4),th:nth-child(4){display:none}}
</style></head><body>
<header>__NAV__<h1>Work list</h1>
<input id="q" placeholder="Search person, place, volume…" size="28">
<select id="kin" title="Relationship to the proband"></select>
<span id="count" class="meta"></span></header>
<main><div class="kinds" id="kinds"></div><p class="why" id="why"></p><table id="tbl"></table></main>
<script type="text/plain" id="view-js">
__JS__</script>__DATA__</body></html>
